<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Network Engineer Interview Prep — MCQ Study App</title>
  <meta name="description" content="Offline-capable MCQ study app with 252 interview-style questions covering Networking Fundamentals, Devices, IP Addressing, TCP/UDP Services, Switching, Routing/OSPF/BGP, Linux Networking, and Packet Analysis." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
:root {
  /* Core palette — deep navy dark mode with electric accents */
  --bg-base: #060a13;
  --bg-surface: #0c1220;
  --bg-elevated: #111827;
  --bg-card: #151d2e;
  --bg-card-hover: #1a2438;
  --bg-input: #0f172a;

  /* Borders */
  --border-subtle: rgba(148, 163, 184, 0.08);
  --border-default: rgba(148, 163, 184, 0.12);
  --border-strong: rgba(148, 163, 184, 0.2);
  --border-accent: rgba(56, 189, 248, 0.3);

  /* Text */
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --text-accent: #38bdf8;
  --text-on-accent: #020617;

  /* Accent colors */
  --accent-primary: #38bdf8;
  --accent-primary-hover: #0ea5e9;
  --accent-primary-glow: rgba(56, 189, 248, 0.15);
  --accent-secondary: #818cf8;
  --accent-warm: #f59e0b;
  --accent-warm-bg: rgba(245, 158, 11, 0.08);
  --accent-warm-border: rgba(245, 158, 11, 0.25);

  /* Semantic */
  --correct: #22c55e;
  --correct-bg: rgba(34, 197, 94, 0.1);
  --correct-border: rgba(34, 197, 94, 0.35);
  --wrong: #ef4444;
  --wrong-bg: rgba(239, 68, 68, 0.1);
  --wrong-border: rgba(239, 68, 68, 0.35);
  --bookmark: #f59e0b;

  /* Spacing */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 24px;
  --space-2xl: 32px;
  --space-3xl: 48px;

  /* Radius */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  --radius-full: 99px;

  /* Shadows */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
  --shadow-glow: 0 0 20px rgba(56, 189, 248, 0.1);

  /* Typography */
  --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  /* Sidebar */
  --sidebar-width: 320px;
}

/* ============================================
   RESET & BASE
   ============================================ */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 15px;
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  height: 100%;
}

body {
  font-family: var(--font-sans);
  background: var(--bg-base);
  color: var(--text-primary);
  line-height: 1.6;
  height: 100%;
  height: 100dvh;
  min-height: -webkit-fill-available;
  display: flex;
  overflow: hidden;
}

/* Custom scrollbar */
::-webkit-scrollbar {
  width: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--text-muted);
}

/* ============================================
   SIDEBAR
   ============================================ */
.sidebar {
  width: var(--sidebar-width);
  min-width: var(--sidebar-width);
  height: 100%;
  height: 100dvh;
  background: var(--bg-surface);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  z-index: 10;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.sidebar-header {
  padding: var(--space-xl);
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  margin-bottom: var(--space-lg);
}

.sidebar-brand-icon {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  box-shadow: 0 0 16px rgba(56, 189, 248, 0.2);
}

.sidebar-brand h1 {
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}

.sidebar-brand .subtitle {
  font-size: 0.73rem;
  color: var(--text-muted);
  font-weight: 400;
  letter-spacing: 0.02em;
}

/* Stats bar */
.sidebar-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-sm);
  margin-top: var(--space-lg);
}

.stat-pill {
  text-align: center;
  padding: var(--space-sm) var(--space-xs);
  background: var(--bg-elevated);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
}

.stat-pill .stat-value {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text-accent);
  display: block;
  line-height: 1.2;
}

.stat-pill .stat-label {
  font-size: 0.65rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 600;
}

/* Search */
.sidebar-search {
  padding: var(--space-lg) var(--space-xl);
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}

.search-input-wrapper {
  position: relative;
}

.search-input-wrapper .search-icon {
  position: absolute;
  left: var(--space-md);
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 14px;
  pointer-events: none;
}

.search-input {
  width: 100%;
  padding: var(--space-md) var(--space-lg);
  padding-left: 36px;
  background: var(--bg-input);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-size: 0.85rem;
  font-family: var(--font-sans);
  transition: all 0.2s ease;
  outline: none;
}

.search-input::placeholder {
  color: var(--text-muted);
}

.search-input:focus {
  border-color: var(--accent-primary);
  box-shadow: 0 0 0 3px var(--accent-primary-glow);
}

/* Filter tabs */
.sidebar-filters {
  padding: var(--space-md) var(--space-xl);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  gap: var(--space-xs);
  flex-shrink: 0;
}

.filter-btn {
  flex: 1;
  padding: var(--space-sm) var(--space-xs);
  background: transparent;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  font-size: 0.7rem;
  font-weight: 600;
  font-family: var(--font-sans);
  cursor: pointer;
  transition: all 0.2s ease;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.filter-btn:hover {
  background: var(--bg-elevated);
  color: var(--text-secondary);
  border-color: var(--border-default);
}

.filter-btn.active {
  background: var(--accent-primary-glow);
  color: var(--accent-primary);
  border-color: var(--accent-primary);
}

/* Topic list */
.sidebar-topics {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-md) var(--space-lg);
  padding-bottom: calc(var(--space-2xl) + 40px + env(safe-area-inset-bottom, 24px));
  -webkit-overflow-scrolling: touch;
}

.topic-btn {
  width: 100%;
  text-align: left;
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid transparent;
  padding: var(--space-md) var(--space-lg);
  border-radius: var(--radius-md);
  margin-bottom: var(--space-xs);
  cursor: pointer;
  font-family: var(--font-sans);
  font-size: 0.85rem;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: var(--space-md);
  position: relative;
}

.topic-btn:hover {
  background: var(--bg-elevated);
  color: var(--text-primary);
  border-color: var(--border-subtle);
}

.topic-btn.active {
  background: var(--accent-primary-glow);
  color: var(--accent-primary);
  border-color: var(--border-accent);
  font-weight: 600;
}

.topic-icon {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  background: var(--bg-elevated);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}

.topic-btn.active .topic-icon {
  background: rgba(56, 189, 248, 0.15);
}

.topic-info {
  flex: 1;
  min-width: 0;
}

.topic-name {
  display: block;
  font-weight: 600;
  font-size: 0.82rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topic-meta {
  display: flex;
  gap: var(--space-sm);
  align-items: center;
  margin-top: 2px;
}

.topic-count {
  font-size: 0.7rem;
  color: var(--text-muted);
}

.topic-progress {
  flex: 1;
  height: 3px;
  background: var(--border-subtle);
  border-radius: 2px;
  overflow: hidden;
}

.topic-progress-bar {
  height: 100%;
  background: var(--correct);
  border-radius: 2px;
  transition: width 0.4s ease;
}

.topic-score {
  font-size: 0.7rem;
  color: var(--correct);
  font-weight: 700;
  font-family: var(--font-mono);
  min-width: 28px;
  text-align: right;
}

/* ============================================
   MAIN CONTENT
   ============================================ */
.main-content {
  flex: 1;
  min-height: 0;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
  position: relative;
}

.main-header {
  padding: var(--space-xl) var(--space-2xl);
  border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-surface);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 5;
  backdrop-filter: blur(12px);
  background: rgba(12, 18, 32, 0.85);
}

.main-title {
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.main-title .question-count {
  color: var(--text-muted);
  font-weight: 400;
  font-size: 0.85rem;
  margin-left: var(--space-sm);
}

.main-actions {
  display: flex;
  gap: var(--space-sm);
}

.action-btn {
  padding: var(--space-sm) var(--space-lg);
  background: var(--bg-elevated);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  color: var(--text-secondary);
  font-size: 0.8rem;
  font-weight: 600;
  font-family: var(--font-sans);
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: var(--space-sm);
}

.action-btn:hover {
  background: var(--bg-card);
  color: var(--text-primary);
  border-color: var(--border-strong);
}

.action-btn.active {
  background: var(--accent-primary-glow);
  color: var(--accent-primary);
  border-color: var(--accent-primary);
}

.hamburger-btn {
  display: none;
  padding: var(--space-sm);
  background: var(--bg-elevated);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 18px;
  cursor: pointer;
  margin-right: var(--space-md);
  line-height: 1;
}

/* Questions container */
.questions-container {
  flex: 1;
  padding: var(--space-2xl);
  padding-bottom: calc(var(--space-3xl) + 80px + env(safe-area-inset-bottom, 24px));
  max-width: 900px;
  margin: 0 auto;
  width: 100%;
}

/* Floating scroll to top button */
.scroll-top-btn {
  position: fixed;
  bottom: calc(24px + env(safe-area-inset-bottom, 16px));
  right: 24px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--bg-card);
  border: 1px solid var(--border-accent);
  color: var(--accent-primary);
  font-size: 20px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5), var(--shadow-glow);
  opacity: 0;
  visibility: hidden;
  transform: translateY(12px);
  transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
  z-index: 50;
  backdrop-filter: blur(8px);
}

.scroll-top-btn.visible {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.scroll-top-btn:hover {
  background: var(--accent-primary);
  color: var(--text-on-accent);
  border-color: var(--accent-primary);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
}

.scroll-top-btn:active {
  transform: translateY(0) scale(0.95);
}

/* Welcome state */
.welcome-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 60vh;
  text-align: center;
  opacity: 0.7;
}

.welcome-state .welcome-icon {
  font-size: 56px;
  margin-bottom: var(--space-xl);
  filter: grayscale(0.3);
}

.welcome-state h2 {
  font-size: 1.4rem;
  font-weight: 600;
  margin-bottom: var(--space-sm);
  color: var(--text-secondary);
}

.welcome-state p {
  color: var(--text-muted);
  font-size: 0.9rem;
  max-width: 400px;
}

/* ============================================
   QUESTION CARDS
   ============================================ */
.question-card {
  background: var(--bg-card);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
  padding: var(--space-xl);
  margin-bottom: var(--space-xl);
  transition: all 0.3s ease;
  position: relative;
}

.question-card:hover {
  border-color: var(--border-strong);
  box-shadow: var(--shadow-md);
}

.question-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-lg);
}

.question-badges {
  display: flex;
  gap: var(--space-sm);
  align-items: center;
}

.badge {
  display: inline-flex;
  align-items: center;
  padding: var(--space-xs) var(--space-md);
  border-radius: var(--radius-full);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.badge-number {
  background: var(--bg-elevated);
  color: var(--text-muted);
  border: 1px solid var(--border-subtle);
  font-family: var(--font-mono);
}

.badge-medium {
  background: rgba(245, 158, 11, 0.1);
  color: var(--accent-warm);
  border: 1px solid rgba(245, 158, 11, 0.2);
}

.badge-hard {
  background: rgba(239, 68, 68, 0.1);
  color: var(--wrong);
  border: 1px solid rgba(239, 68, 68, 0.2);
}

.bookmark-btn {
  background: transparent;
  border: none;
  font-size: 18px;
  cursor: pointer;
  padding: var(--space-xs);
  opacity: 0.3;
  transition: all 0.2s ease;
  line-height: 1;
}

.bookmark-btn:hover {
  opacity: 0.7;
  transform: scale(1.15);
}

.bookmark-btn.bookmarked {
  opacity: 1;
}

.question-text {
  font-size: 1.05rem;
  font-weight: 600;
  line-height: 1.5;
  color: var(--text-primary);
  margin-bottom: var(--space-xl);
}

/* Options */
.options-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
}

.option-btn {
  width: 100%;
  text-align: left;
  padding: var(--space-lg) var(--space-lg);
  padding-left: 48px;
  background: var(--bg-input);
  color: var(--text-primary);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  cursor: pointer;
  font-family: var(--font-sans);
  font-size: 0.9rem;
  line-height: 1.5;
  transition: all 0.2s ease;
  position: relative;
}

.option-btn .option-letter {
  position: absolute;
  left: var(--space-lg);
  top: 50%;
  transform: translateY(-50%);
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--bg-elevated);
  border: 1px solid var(--border-default);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--text-muted);
  transition: all 0.2s ease;
}

.option-btn:hover:not(:disabled) {
  border-color: var(--accent-primary);
  background: rgba(56, 189, 248, 0.04);
}

.option-btn:hover:not(:disabled) .option-letter {
  border-color: var(--accent-primary);
  color: var(--accent-primary);
}

.option-btn:disabled {
  cursor: default;
}

.option-btn.correct {
  border-color: var(--correct-border);
  background: var(--correct-bg);
}

.option-btn.correct .option-letter {
  background: var(--correct);
  border-color: var(--correct);
  color: white;
}

.option-btn.wrong {
  border-color: var(--wrong-border);
  background: var(--wrong-bg);
}

.option-btn.wrong .option-letter {
  background: var(--wrong);
  border-color: var(--wrong);
  color: white;
}

.option-btn.unselected-correct {
  border-color: var(--correct-border);
  background: var(--correct-bg);
}

.option-btn.unselected-correct .option-letter {
  background: var(--correct);
  border-color: var(--correct);
  color: white;
}

/* Answer reveal sections */
.answer-section {
  margin-top: var(--space-xl);
  animation: slideReveal 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes slideReveal {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.reveal-box {
  padding: var(--space-lg) var(--space-xl);
  border-radius: var(--radius-md);
  margin-bottom: var(--space-lg);
  line-height: 1.7;
  font-size: 0.9rem;
}

.reveal-box.explanation-box {
  background: rgba(56, 189, 248, 0.05);
  border: 1px solid rgba(56, 189, 248, 0.15);
  border-left: 3px solid var(--accent-primary);
}

.reveal-box.doc-box {
  background: rgba(245, 158, 11, 0.04);
  border: 1px solid rgba(245, 158, 11, 0.12);
  border-left: 3px solid var(--accent-warm);
}

.reveal-label {
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 700;
  margin-bottom: var(--space-md);
  display: flex;
  align-items: center;
  gap: var(--space-sm);
}

.reveal-label.accent {
  color: var(--accent-primary);
}

.reveal-label.warm {
  color: var(--accent-warm);
}

.doc-question-heading {
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: var(--space-md);
  font-size: 0.95rem;
}

.doc-answer-text {
  color: var(--text-secondary);
  white-space: pre-wrap;
  line-height: 1.75;
}

/* ============================================
   REVIEW MODE
   ============================================ */
.review-card {
  background: var(--bg-card);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
  padding: var(--space-xl);
  margin-bottom: var(--space-lg);
}

.review-card .review-question {
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: var(--space-lg);
  display: flex;
  gap: var(--space-md);
}

.review-card .review-question .review-num {
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 0.85rem;
  flex-shrink: 0;
}

.review-card .review-answer {
  color: var(--text-secondary);
  white-space: pre-wrap;
  line-height: 1.75;
  padding-left: var(--space-xl);
  border-left: 2px solid var(--border-subtle);
}

/* ============================================
   NO RESULTS STATE
   ============================================ */
.no-results {
  text-align: center;
  padding: var(--space-3xl) var(--space-xl);
  color: var(--text-muted);
}

.no-results .no-results-icon {
  font-size: 48px;
  margin-bottom: var(--space-lg);
  opacity: 0.5;
}

.no-results h3 {
  font-size: 1.1rem;
  color: var(--text-secondary);
  margin-bottom: var(--space-sm);
}

/* ============================================
   MOBILE OVERLAY
   ============================================ */
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  z-index: 9;
  backdrop-filter: blur(4px);
}

    'switching_layer2': '🔀',
    'routing_ospf_bgp': '🛣️',
    'linux_networking': '🐧',
    'network_troubleshooting': '🔍',

    // GenAI Topics (for backwards compatibility)
    'ai_agents_interview_bank': '🤖',
    'ai_engineering_interview_bank': '⚙️',
    'agentic_ai_interview_bank': '🧬',
    'genai_fresher_fundamentals': '📚',
    'llm_interview_bank': '🧠',
    'production_genai_interview_bank': '🏭',
    'prompt_engineering_interview_bank': '✍️',
    'rag_interview_bank': '🔍',
  };

  // =========================================
  // LOCAL STORAGE HELPERS
  // =========================================
  const STORAGE_KEY = 'network-mcq-progress';

  function loadProgress() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch {
      return {};
    }
  }

  function saveProgress(progress) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    } catch {
      // localStorage might be full or disabled — silently ignore
    }
  }

  function getQuestionState(questionId) {
    const progress = loadProgress();
    return progress[questionId] || null;
  }

  function setQuestionState(questionId, state) {
    const progress = loadProgress();
    progress[questionId] = state;
    saveProgress(progress);
  }

  function isBookmarked(questionId) {
    const progress = loadProgress();
    return progress[questionId]?.bookmarked || false;
  }

  function toggleBookmark(questionId) {
    const progress = loadProgress();
    if (!progress[questionId]) {
      progress[questionId] = { bookmarked: true };
    } else {
      progress[questionId].bookmarked = !progress[questionId].bookmarked;
    }
    saveProgress(progress);
    return progress[questionId].bookmarked;
  }

  function resetTopicProgress(topicId) {
    const progress = loadProgress();
    const topic = topics.find(t => t.topicId === topicId);
    if (!topic) return;

    topic.questions.forEach(q => {
      delete progress[q.id];
    });
    saveProgress(progress);
  }

  // =========================================
  // STATS COMPUTATION
  // =========================================
  function computeGlobalStats() {
    const progress = loadProgress();
    let total = 0;
    let answered = 0;
    let correct = 0;

    topics.forEach(topic => {
      topic.questions.forEach(q => {
        total++;
        const state = progress[q.id];
        if (state && state.answered) {
          answered++;
          if (state.correct) correct++;
        }
      });
    });

    return { total, answered, correct };
  }

  function computeTopicStats(topicId) {
    const progress = loadProgress();
    const topic = topics.find(t => t.topicId === topicId);
    if (!topic) return { total: 0, answered: 0, correct: 0 };

    let answered = 0;
    let correct = 0;

    topic.questions.forEach(q => {
      const state = progress[q.id];
      if (state && state.answered) {
        answered++;
        if (state.correct) correct++;
      }
    });

    return { total: topic.questions.length, answered, correct };
  }

  // =========================================
  // DOM REFERENCES
  // =========================================
  const topicListEl = document.getElementById('topic-list');
  const containerEl = document.getElementById('questions-container');
  const titleEl = document.getElementById('main-title');
  const questionCountEl = document.getElementById('question-count');
  const searchInputEl = document.getElementById('search-input');
  const welcomeEl = document.getElementById('welcome-state');
  const reviewToggleBtn = document.getElementById('review-toggle');
  const resetBtn = document.getElementById('reset-btn');
  const sidebarEl = document.getElementById('sidebar');
  const overlayEl = document.getElementById('sidebar-overlay');
  const hamburgerBtn = document.getElementById('hamburger-btn');
  const statTotalEl = document.getElementById('stat-total');
  const statAnsweredEl = document.getElementById('stat-answered');
  const statCorrectEl = document.getElementById('stat-correct');
  const filterBtns = document.querySelectorAll('.filter-btn');
  const mainContentEl = document.querySelector('.main-content');
  const scrollTopBtn = document.getElementById('scroll-top-btn');

  // =========================================
  // RENDER: GLOBAL STATS
  // =========================================
  function renderGlobalStats() {
    const stats = computeGlobalStats();
    statTotalEl.textContent = stats.total;
    statAnsweredEl.textContent = stats.answered;
    statCorrectEl.textContent = stats.correct;
  }

  // =========================================
  // RENDER: TOPIC SIDEBAR
  // =========================================
  function renderTopics() {
    topicListEl.innerHTML = '';

    topics.forEach(topic => {
      const stats = computeTopicStats(topic.topicId);
      const progressPercent = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 0;
      const icon = TOPIC_ICONS[topic.topicId] || '📄';

      const btn = document.createElement('button');
      btn.className = 'topic-btn' + (topic.topicId === activeTopicId ? ' active' : '');
      btn.setAttribute('data-topic-id', topic.topicId);

      btn.innerHTML = `
        <div class="topic-icon">${icon}</div>
        <div class="topic-info">
          <span class="topic-name">${escapeHtml(topic.topicName)}</span>
          <div class="topic-meta">
            <span class="topic-count">${topic.questions.length} Qs</span>
            <div class="topic-progress">
              <div class="topic-progress-bar" style="width: ${progressPercent}%"></div>
            </div>
            <span class="topic-score">${progressPercent}%</span>
          </div>
        </div>
      `;

      btn.addEventListener('click', () => {
        selectTopic(topic.topicId);
        closeSidebar();
      });

      topicListEl.appendChild(btn);
    });
  }

  // =========================================
  // RENDER: QUESTIONS
  // =========================================
  function selectTopic(topicId) {
    activeTopicId = topicId;
    isReviewMode = false;
    reviewToggleBtn.classList.remove('active');
    renderTopics();
    renderQuestions();
    renderGlobalStats();
    if (mainContentEl) {
      mainContentEl.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  const OPTION_LETTERS = ['A', 'B', 'C', 'D'];

  function getFilteredQuestions(topic) {
    const progress = loadProgress();
    let questions = topic.questions;

    // Apply filter
    if (activeFilter === 'unanswered') {
      questions = questions.filter(q => {
        const state = progress[q.id];
        return !state || !state.answered;
      });
    } else if (activeFilter === 'incorrect') {
      questions = questions.filter(q => {
        const state = progress[q.id];
        return state && state.answered && !state.correct;
      });
    } else if (activeFilter === 'bookmarked') {
      questions = questions.filter(q => {
        const state = progress[q.id];
        return state && state.bookmarked;
      });
    }

    // Apply search
    if (searchQuery) {
      const query = searchQuery.toLowerCase();
      questions = questions.filter(q =>
        (q.mcqQuestion && q.mcqQuestion.toLowerCase().includes(query)) ||
        (q.originalDocQuestion && q.originalDocQuestion.toLowerCase().includes(query)) ||
        (q.originalDocAnswer && q.originalDocAnswer.toLowerCase().includes(query)) ||
        (q.mcqExplanation && q.mcqExplanation.toLowerCase().includes(query)) ||
        (q.options && q.options.some(opt => opt.toLowerCase().includes(query)))
      );
    }

    return questions;
  }

  function renderQuestions() {
    const topic = topics.find(t => t.topicId === activeTopicId);
    if (!topic) {
      containerEl.innerHTML = '';
      containerEl.appendChild(welcomeEl);
      welcomeEl.style.display = 'flex';
      titleEl.innerHTML = 'Select a Topic';
      questionCountEl.textContent = '';
      return;
    }

    welcomeEl.style.display = 'none';

    const filteredQuestions = getFilteredQuestions(topic);

    titleEl.innerHTML = escapeHtml(topic.topicName);
    questionCountEl.textContent = `${filteredQuestions.length} question${filteredQuestions.length !== 1 ? 's' : ''}`;

    containerEl.innerHTML = '';

    if (filteredQuestions.length === 0) {
      containerEl.innerHTML = `
        <div class="no-results">
          <div class="no-results-icon">🔎</div>
          <h3>No questions match</h3>
          <p>Try a different filter or search term.</p>
        </div>
      `;
      return;
    }

    if (isReviewMode) {
      renderReviewMode(filteredQuestions, topic);
      return;
    }

    filteredQuestions.forEach((q, idx) => {
      const card = createQuestionCard(q, idx, topic);
      containerEl.appendChild(card);
    });
  }

  function createQuestionCard(q, idx, topic) {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.setAttribute('data-question-id', q.id);

    const progress = loadProgress();
    const savedState = progress[q.id];
    const isAnswered = Boolean(savedState && savedState.answered);
    const savedBookmarked = Boolean(savedState && savedState.bookmarked);
    const selectedIndex = isAnswered ? savedState.selectedIndex : null;

    const difficultyClass = q.difficulty === 'Hard' ? 'badge-hard' : 'badge-medium';
    const displayQuestion = q.mcqQuestion || q.originalDocQuestion;

    card.innerHTML = `
      <div class="question-card-header">
        <div class="question-badges">
          <span class="badge badge-number">Q${idx + 1}</span>
          <span class="badge ${difficultyClass}">${q.difficulty}</span>
        </div>
        <button class="bookmark-btn ${savedBookmarked ? 'bookmarked' : ''}" data-qid="${q.id}" aria-label="Bookmark">
          ${savedBookmarked ? '⭐' : '☆'}
        </button>
      </div>
      <div class="question-text">${escapeHtml(displayQuestion)}</div>
      <div class="options-list"></div>
      <div class="answer-section" style="${isAnswered ? 'display:block;' : 'display:none;'}">
        <div class="reveal-box explanation-box">
          <div class="reveal-label accent">
            💡 Answer Explanation
          </div>
          <div class="explanation-text">${escapeHtml(q.mcqExplanation || 'Explanation unavailable.')}</div>
        </div>
        <div class="reveal-box doc-box">
          <div class="reveal-label warm">
            📄 Original Document Verbatim Reference (${escapeHtml(topic.sourceFile)})
          </div>
          <div class="doc-question-heading">${escapeHtml(q.originalDocQuestion)}</div>
          <div class="doc-answer-text">${escapeHtml(q.originalDocAnswer)}</div>
        </div>
      </div>
    `;

    // Bookmark handler
    const bookmarkBtn = card.querySelector('.bookmark-btn');
    bookmarkBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isNowBookmarked = toggleBookmark(q.id);
      bookmarkBtn.className = 'bookmark-btn' + (isNowBookmarked ? ' bookmarked' : '');
      bookmarkBtn.innerHTML = isNowBookmarked ? '⭐' : '☆';

      // If currently filtering by bookmarked and we un-bookmarked, re-render
      if (activeFilter === 'bookmarked' && !isNowBookmarked) {
        renderQuestions();
      }
    });

    const optionsList = card.querySelector('.options-list');
    const answerSection = card.querySelector('.answer-section');
    const optionBtns = [];

    const options = (Array.isArray(q.options) && q.options.length > 0)
      ? q.options
      : [q.originalDocAnswer];

    options.forEach((optText, optIdx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.type = 'button';

      if (isAnswered) {
        btn.disabled = true;
        if (optIdx === selectedIndex) {
          btn.classList.add(savedState.correct ? 'correct' : 'wrong');
        } else if (optIdx === q.correctIndex && !savedState.correct) {
          btn.classList.add('unselected-correct');
        }
      }

      btn.innerHTML = `
        <span class="option-letter">${OPTION_LETTERS[optIdx] || (optIdx + 1)}</span>
        <span>${escapeHtml(optText)}</span>
      `;

      btn.addEventListener('click', () => {
        const currentSaved = getQuestionState(q.id);
        if (currentSaved && currentSaved.answered) return;

        const isCorrect = (optIdx === q.correctIndex);

        // Mark as answered
        setQuestionState(q.id, {
          answered: true,
          selectedIndex: optIdx,
          correct: isCorrect,
          bookmarked: isBookmarked(q.id),
        });

        // Update button states
        optionBtns.forEach((otherBtn, oIdx) => {
          otherBtn.disabled = true;
          if (oIdx === optIdx) {
            otherBtn.classList.add(isCorrect ? 'correct' : 'wrong');
          } else if (oIdx === q.correctIndex && !isCorrect) {
            otherBtn.classList.add('unselected-correct');
          }
        });

        // Show answer reveal section
        answerSection.style.display = 'block';

        // Auto-scroll newly revealed explanation into view on mobile
        setTimeout(() => {
          const rect = answerSection.getBoundingClientRect();
          const viewportHeight = window.innerHeight || document.documentElement.clientHeight;
          if (rect.bottom > viewportHeight - 50) {
            answerSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        }, 80);

        renderGlobalStats();
        renderTopics();
      });

      optionBtns.push(btn);
      optionsList.appendChild(btn);
    });

    return card;
  }

  // =========================================
  // RENDER: REVIEW MODE
  // =========================================
  function renderReviewMode(questions, topic) {
    questions.forEach((q, idx) => {
      const card = document.createElement('div');
      card.className = 'review-card';
      const correctOptionText = (q.options && q.options[q.correctIndex]) ? q.options[q.correctIndex] : q.originalDocAnswer;
      const letter = OPTION_LETTERS[q.correctIndex] || '✓';

      card.innerHTML = `
        <div class="review-question">
          <span class="review-num">Q${idx + 1}</span>
          <div style="flex:1;">
            <div style="font-weight: 700; color: var(--text-primary); margin-bottom: var(--space-xs);">
              ${escapeHtml(q.mcqQuestion || q.originalDocQuestion)}
            </div>
            <div style="font-size: 0.85rem; color: var(--accent-primary); margin-bottom: var(--space-sm);">
              Correct Answer (${letter}): <span style="color: var(--correct); font-weight: 600;">${escapeHtml(correctOptionText)}</span>
            </div>
          </div>
        </div>
        ${q.mcqExplanation ? `
          <div style="margin-bottom: var(--space-md); padding: var(--space-md); background: rgba(56, 189, 248, 0.05); border-left: 2px solid var(--accent-primary); border-radius: var(--radius-sm); font-size: 0.88rem; color: var(--text-secondary); line-height: 1.6;">
            <strong>Explanation:</strong> ${escapeHtml(q.mcqExplanation)}
          </div>
        ` : ''}
        <div class="review-answer">
          <div style="font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent-warm); font-weight: 700; margin-bottom: var(--space-xs);">
            📄 Verbatim Reference (${escapeHtml(topic.sourceFile)})
          </div>
          <div>${escapeHtml(q.originalDocAnswer)}</div>
        </div>
      `;
      containerEl.appendChild(card);
    });
  }

  // =========================================
  // EVENT HANDLERS
  // =========================================

  // Search
  searchInputEl.addEventListener('input', (e) => {
    searchQuery = e.target.value.trim();
    if (activeTopicId) {
      renderQuestions();
    }
  });

  // Filters
  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.getAttribute('data-filter');
      if (activeTopicId) {
        renderQuestions();
      }
    });
  });

  // Review mode toggle
  reviewToggleBtn.addEventListener('click', () => {
    isReviewMode = !isReviewMode;
    reviewToggleBtn.classList.toggle('active', isReviewMode);
    if (activeTopicId) {
      renderQuestions();
    }
  });

  // Reset topic progress
  resetBtn.addEventListener('click', () => {
    if (!activeTopicId) return;
    const topic = topics.find(t => t.topicId === activeTopicId);
    if (!topic) return;

    const confirmed = confirm(`Reset all progress for "${topic.topicName}"?`);
    if (!confirmed) return;

    resetTopicProgress(activeTopicId);
    renderTopics();
    renderQuestions();
    renderGlobalStats();
  });

  // Mobile sidebar
  hamburgerBtn.addEventListener('click', () => {
    sidebarEl.classList.toggle('open');
    overlayEl.classList.toggle('visible');
  });

  overlayEl.addEventListener('click', closeSidebar);

  function closeSidebar() {
    sidebarEl.classList.remove('open');
    overlayEl.classList.remove('visible');
  }

  // Scroll to top button handler
  if (scrollTopBtn && mainContentEl) {
    mainContentEl.addEventListener('scroll', () => {
      if (mainContentEl.scrollTop > 280) {
        scrollTopBtn.classList.add('visible');
      } else {
        scrollTopBtn.classList.remove('visible');
      }
    }, { passive: true });

    scrollTopBtn.addEventListener('click', () => {
      mainContentEl.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  // =========================================
  // UTILITIES
  // =========================================
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // =========================================
  // INIT
  // =========================================
  function init() {
    renderGlobalStats();
    renderTopics();

    // Auto-select first topic if available
    if (topics.length > 0) {
      // Don't auto-select — show welcome state
    }
  }

  init();
})();

  </script>
</body>
</html>
